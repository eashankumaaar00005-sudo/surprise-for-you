<!DOCTYPE html>
<html lang="en">
<head>
    <!--
        ============================================================
        A Secret Journey
        Premium Interactive Romantic Experience
        Mobile First
        ============================================================
    -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>A Secret Journey</title>

    <meta name="theme-color" content="#0B0B10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta
        name="description"
        content="A premium interactive romantic digital surprise."
    >

    <!-- Preload -->
    <link rel="preload" href="css/style.css" as="style">
    <link rel="preload" href="js/script.js" as="script">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ========================================================= -->
<!-- Animated Background -->
<!-- ========================================================= -->

<div class="background">

    <div class="gradient-layer"></div>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <div class="particles" id="particles"></div>

</div>

<!-- ========================================================= -->
<!-- Main App -->
<!-- ========================================================= -->

<main id="app">

<!-- ========================================================= -->
<!-- Welcome Screen -->
<!-- ========================================================= -->

<section
class="screen welcome-screen active"
id="welcome">

<div
class="glass-panel"
id="welcomeContent">

</div>

</section>

<!-- ========================================================= -->
<!-- Envelope Scene -->
<!-- ========================================================= -->

<section
class="screen envelope-screen hidden"
id="envelopeScene">

<div class="scene-wrapper">

<div class="envelope-container">

<div
class="envelope"
id="envelope">

<div class="envelope-shadow"></div>

<div class="envelope-back"></div>

<div
class="envelope-letter-slot">

<div
class="letter-preview">

<div class="paper-line"></div>
<div class="paper-line"></div>
<div class="paper-line short"></div>

</div>

</div>

<div
class="envelope-front">

</div>

<div
class="envelope-flap">

</div>

</div>

</div>
<div
class="instruction"
id="envelopeInstruction">

</div>

</div>

</section>

<!-- ========================================================= -->
<!-- Letter -->
<!-- ========================================================= -->

<section
class="screen letter-screen hidden"
id="letterScene">

<div class="letter-wrapper">

<article
class="letter-paper"
id="letterPaper">

<div
class="paper-top-glow">

</div>

<div
class="paper-content"
id="letterContent">

</div>

</article>

</div>

</section>

<!-- ========================================================= -->
<!-- Gallery -->
<!-- ========================================================= -->

<section
class="screen gallery-screen hidden"
id="gallery">

<div 
class="section-header"
id="galleryHeader">

</div>

<div
class="gallery-list"
id="galleryList">

</div>

</section>
<!-- ========================================================= -->
<!-- Final Message -->
<!-- ========================================================= -->

<section
class="screen ending-screen hidden"
id="ending">

<div
class="glass-panel ending-card"
id="endingContent">

</div>
</section>

</main>

<!-- ========================================================= -->
<!-- Music -->
<!-- ========================================================= -->

<audio
id="bgMusic"
loop
preload="auto">

<audio
id="bgMusic"
loop
preload="auto">
</audio>

<!-- Floating Music Button -->

<button
id="musicButton"
class="music-button"
aria-label="Toggle Music">

<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<path
d="M9 18V5l12-2v13"/>

<circle
cx="6"
cy="18"
r="3"/>

<circle
cx="18"
cy="16"
r="3"/>

</svg>

</button>

<!-- Scroll Progress -->

<div
class="scroll-progress">

<div
id="progressBar">

</div>

</div>

<!-- Blur Overlay -->

<div
id="blurOverlay">

<!-- Configuration -->

<script src="config.js"></script>

<!-- App -->

<script src="js/script.js"></script>

</body>
</html>
